<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Links -->
    <link rel="stylesheet" href="./styles/components/main.css">
    <link rel="stylesheet" href="./styles/components/buttons.css">
    <link rel="stylesheet" href="./styles/components/register.css">
</head>
<body class="login-page">
    <main class="register-card">
  
            <h1 class="register-title">Iniciar sessío</h1>
            <p class="register-subtitle">Benvingut de nou! Introdueix les teves dades per continuar.</p>

            <form class="register-form" id="login-form">
            <!-- Email -->
            <div class="input-group">
                <span class="input-icon" aria-hidden="true">
                    <span class="material-symbols-outlined">mail</span>
                </span>
                <input type="email" id="email" name="email" class="form-input" placeholder="El teu correu electrònic" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <span class="input-icon" aria-hidden="true">
                    <span class="material-symbols-outlined">lock</span>
                </span>
                <input type="password" id="password" name="password" class="form-input" placeholder="La teva contrasenya" required>
            </div>

            <!-- Forgot Password -->
            <div class="forgot-password-container">
                <a href="./forgot-password.html" class="link-highlight forgot-link">Has oblidat la contrasenya?</a>
            </div>  

            <button type="submit" class="btn-primary">Inicia sessió</button>
        </form>
            
            <div class="divider">
                <span>o</span>
            </div>
            <!--Buttons-->    
            <div class="social-buttons">
                <button type="button" class="btn-social btn-apple">
                    <span class="social-icon" aria-hidden="true"><i class="fa-brands fa-apple social-icon"></i></span>Continua amb Apple
                </button>
                <button type="button" class="btn-social btn-google">
                    <span class="social-icon" aria-hidden="true"><i class="fa-brands fa-google social-icon"></i></span>Continua amb Google
                </button>
                 <button type="button" class="btn-social btn-facebook">
                    <span class="social-icon" aria-hidden="true"><i class="fa-brands fa-facebook social-icon"></i></span>Continua amb Facebook
                </button>
            </div>
            <p class="login-redirect">
                No tens un compte? <a href="./register.html" class="link-highlight">Registra't</a>
            </p>
       
     </main>
</body>
</html>
